<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Event Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="div1">
        <form id="regform">

        <h2 id="head1">Registration</h2>

        <label for="name">FullName</label><br>
        <input type="text" id="input1" placeholder="enter your name" required><br>
        <span id="namerror"></span><br>

        <label for="email">Email</label><br>
        <input type="email" id="input2" placeholder="enter your email" required><br>
        <span id="emailerror"></span><br>

        <label for="number">Mobile Number</label><br>
        <input type="text" id="input3" placeholder="enter your mobile number" minlength="10" maxlength="10" required><br>
        <span id="phonerror"></span><br>

        <label for="dob">Date of Birth</label><br>
        <input type="date" id="dob" placeholder="select dob" max="2026-11-24" required><br>
        <span id="doberror"></span><br>

        <label for="gender">Gender</label><br>
        <input type="radio" value="male" name="gender">male
        <input type="radio" value="female" name="gender">female
        <input type="radio" value="other" name="gender">other <br>
        <span id="gendererror"></span><br>

        <label for="workshop">Workshop Selection</label><br>
        <select id="workshop">
            <option value="">Select your course</option>
            <option value="Web development">Web development</option>
            <option value="Data Analytics">Data Analytics</option>
            <option value="Artificial Intelligence">Artificial Intelligence</option>
        </select><br>
        <p id="workshoperror"></p><br>

        <label for="skills">Skills Known</label><br>
        <input type="checkbox" name="skills" value="HTML">HTML
        <input type="checkbox" name="skills" value="CSS">CSS
        <input type="checkbox" name="skills" value="Javascript">Javascript
        <input type="checkbox" name="skills" value="Python">Python <br><br>
        <span id="skilerror"></span><br>

        <label for="termsandcondition">Terms and Condition</label><br>
        <input type="checkbox" id="terms" required>I agree all the terms and conditions. <br>
        <span id="termserror"></span><br>

        <button type="submit">submit</button>

    </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
